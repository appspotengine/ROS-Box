<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 100" width="115" height="100">
  <defs>
    <style><![CDATA[
      /* ================= 60FPS MIKROTIK CYBER ORBITAL ANIMATIONS ================= */
      
      /* 3D Surrounding Orbital Ring 1 - Smooth Continuous 360 Spin */
      @keyframes orbitSurround1 {
        0% {
          transform: rotate(-26deg) rotateX(62deg) rotateZ(0deg);
        }
        100% {
          transform: rotate(-26deg) rotateX(62deg) rotateZ(360deg);
        }
      }

      /* 3D Surrounding Orbital Ring 2 - Reverse Counter-Rotation */
      @keyframes orbitSurround2 {
        0% {
          transform: rotate(32deg) rotateX(65deg) rotateZ(360deg);
        }
        100% {
          transform: rotate(32deg) rotateX(65deg) rotateZ(0deg);
        }
      }

      /* Central sing-box Quantum Core - Breathing Reactor */
      @keyframes quantumCoreBreathe {
        0%, 100% {
          r: 15px;
          opacity: 0.9;
          filter: drop-shadow(0 0 10px #00f0ff);
        }
        50% {
          r: 21px;
          opacity: 1;
          filter: drop-shadow(0 0 22px #00d2ff) drop-shadow(0 0 35px #0284c7);
        }
      }

      /* Glass Top Facet Specular Light Sweep */
      @keyframes crystalSheen {
        0% {
          opacity: 0.2;
          transform: translateX(-15px) translateY(-8px);
        }
        50% {
          opacity: 0.75;
          transform: translateX(18px) translateY(9px);
        }
        100% {
          opacity: 0.2;
          transform: translateX(-15px) translateY(-8px);
        }
      }

      /* High-Visibility LEDs */
      @keyframes pwrHaloPulse {
        0%, 100% {
          r: 4.8px;
          opacity: 0.5;
          filter: drop-shadow(0 0 4px #10b981);
        }
        50% {
          r: 7.2px;
          opacity: 0.95;
          filter: drop-shadow(0 0 10px #10b981);
        }
      }

      @keyframes wanCyanHalo {
        0%, 100% {
          r: 4.8px;
          opacity: 0.6;
          filter: drop-shadow(0 0 4px #00f0ff);
        }
        50% {
          r: 7.5px;
          opacity: 1;
          filter: drop-shadow(0 0 12px #00f0ff);
        }
      }

      @keyframes dataPacketBurst {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        15% { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 8px #34d399); }
        35% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 0.95; transform: scale(1.25); filter: drop-shadow(0 0 7px #fbbf24); }
        70% { opacity: 0.2; transform: scale(0.9); }
        85% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 8px #34d399); }
      }

      /* Chevrons */
      @keyframes chevTravel1 {
        0% { opacity: 0.2; transform: translateX(-6px); }
        50% { opacity: 1; transform: translateX(0px); filter: drop-shadow(0 0 4px #ffffff); }
        100% { opacity: 0.3; transform: translateX(6px); }
      }
      @keyframes chevTravel2 {
        0% { opacity: 0.3; transform: translateX(-4px); }
        50% { opacity: 1; transform: translateX(2px); filter: drop-shadow(0 0 5px #00f0ff); }
        100% { opacity: 0.2; transform: translateX(8px); }
      }

      /* Classes */
      .orbit-wrap-1 {
        transform-origin: 52px 50px;
        animation: orbitSurround1 7s linear infinite;
      }
      .orbit-wrap-2 {
        transform-origin: 52px 50px;
        animation: orbitSurround2 9s linear infinite;
      }
      .anim-core {
        animation: quantumCoreBreathe 3s ease-in-out infinite;
      }
      .anim-sheen {
        animation: crystalSheen 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .anim-pwr-halo {
        animation: pwrHaloPulse 2.2s ease-in-out infinite;
      }
      .anim-wan-halo {
        animation: wanCyanHalo 1.7s ease-in-out infinite;
      }
      .anim-data-burst {
        transform-origin: 74px 72px;
        animation: dataPacketBurst 1.1s steps(8, end) infinite;
      }
      .anim-chev-1 {
        animation: chevTravel1 1.3s ease-in-out infinite;
      }
      .anim-chev-2 {
        animation: chevTravel2 1.3s ease-in-out infinite 0.2s;
      }

      /* Dark/Light Responsive Typography */
      .ros-text-brand { fill: #003865; }
      .ros-text-sub { fill: #004e82; }
      .ros-text-desc { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .ros-text-brand { fill: #f8fafc; }
        .ros-text-sub { fill: #38bdf8; }
        .ros-text-desc { fill: #94a3b8; }
      }
    ]]></style>

    <!-- BRIGHT MIKROTIK CYBER BLUE & ICE CRYSTAL GRADIENTS -->
    <radialGradient id="cyberBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#003865" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#001428" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Ice Crystal Top Lid -->
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </linearGradient>

    <!-- Translucent Sapphire Left Facet (Light & Vivid) -->
    <linearGradient id="sapphireLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#004e82" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#002d50" stop-opacity="0.9" />
    </linearGradient>

    <!-- Translucent Cyan-Azure Right Facet -->
    <linearGradient id="cyanRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#003865" stop-opacity="0.9" />
    </linearGradient>

    <!-- Quantum Core Plasma Glow -->
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#004e82" stop-opacity="0" />
    </radialGradient>

    <!-- Surrounding 3D Orbit Gradient 1 (Neon Cyan to Emerald) -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Surrounding 3D Orbit Gradient 2 (White Diamond Stream) -->
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Metallic Specular Edge Highlight -->
    <linearGradient id="specularEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#004e82" />
    </linearGradient>

    <filter id="hologramDrop" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#002244" flood-opacity="0.45" />
    </filter>
  </defs>
  <g transform="translate(6, 0)">
    <!-- Cyan Ambient Backlight Aura -->
    <ellipse cx="52" cy="50" rx="46" ry="38" fill="url(#cyberBacklight)" />

    <!-- REAR SURROUNDING ORBIT ARC (passes behind the cube in 3D) -->
    <g class="orbit-wrap-1">
      <ellipse cx="52" cy="50" rx="48" ry="18" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.2" stroke-dasharray="14, 8" opacity="0.85" />
      <!-- Traveling Photon Nodes -->
      <circle cx="100" cy="50" r="3.2" fill="#00f0ff" filter="drop-shadow(0 0 6px #00f0ff)" />
      <circle cx="100" cy="50" r="1.4" fill="#ffffff" />
      <circle cx="4" cy="50" r="2.8" fill="#10b981" filter="drop-shadow(0 0 5px #10b981)" />
    </g>

    <g class="orbit-wrap-2">
      <ellipse cx="52" cy="50" rx="42" ry="15" fill="none" stroke="url(#orbitGrad2)" stroke-width="1.8" stroke-dasharray="24, 6" opacity="0.9" />
      <circle cx="94" cy="50" r="2.6" fill="#ffffff" filter="drop-shadow(0 0 5px #ffffff)" />
    </g>

    <!-- THE 3D FROSTED CRYSTAL CUBE -->
    <g filter="url(#hologramDrop)">
      <!-- Back Wall Interiors (Translucent Depth) -->
      <path d="M 52,48 L 52,14 L 18,32 L 18,66 Z" fill="#002d50" opacity="0.6" />
      <path d="M 52,48 L 52,14 L 86,32 L 86,66 Z" fill="#001e38" opacity="0.65" />
      
      <!-- Interior Floor Plate with High-Speed Bus -->
      <path d="M 52,48 L 18,66 L 52,84 L 86,66 Z" fill="#002244" opacity="0.8" />
      <path d="M 32,58 L 52,70 L 72,58" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.75" fill="none" />

      <!-- Inside Central sing-box Quantum Core (Crystal Clear View) -->
      <circle cx="52" cy="48" r="17" fill="url(#plasmaGlow)" class="anim-core" />

      <!-- Internal High-Contrast Vector Routing Chevrons -->
      <g>
        <polyline points="41,43 49,48 41,53" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class="anim-chev-1" />
        <polyline points="53,43 61,48 53,53" fill="none" stroke="#00f0ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class="anim-chev-2" />
      </g>

      <!-- Front Left Facet (Translucent Frosted Sapphire) -->
      <path d="M 52,48 L 18,30 L 18,66 L 52,84 Z" fill="url(#sapphireLeft)" />
      <!-- Left Glass Bevel Reflection -->
      <path d="M 52,48 L 18,30 L 30,36 L 52,48 Z" fill="#ffffff" opacity="0.32" />

      <!-- Front Right Facet (Translucent Electric Cyan) -->
      <path d="M 52,48 L 86,30 L 86,66 L 52,84 Z" fill="url(#cyanRight)" />
      <!-- Right Glass Bevel Reflection -->
      <path d="M 52,48 L 86,30 L 74,36 L 52,48 Z" fill="#ffffff" opacity="0.25" />

      <!-- Precision Router Vent Streams on Right Facet -->
      <line x1="60" y1="52" x2="78" y2="43" stroke="#00f0ff" stroke-width="1.4" opacity="0.65" />
      <line x1="60" y1="58" x2="78" y2="49" stroke="#00f0ff" stroke-width="1.4" opacity="0.65" />
      <line x1="60" y1="64" x2="78" y2="55" stroke="#00f0ff" stroke-width="1.4" opacity="0.65" />

      <!-- Top Frosted Ice Crystal Lid -->
      <path d="M 52,12 L 86,30 L 52,48 L 18,30 Z" fill="url(#crystalTop)" />
      <!-- Top Dynamic Light Sheen Sweep -->
      <path d="M 52,14 L 83,30 L 67,40 L 36,24 Z" fill="#ffffff" class="anim-sheen" opacity="0.55" />

      <!-- Brilliant Metallic Specular Edges -->
      <path d="M 52,12 L 86,30 L 52,48 L 18,30 Z" fill="none" stroke="url(#specularEdge)" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="52" y1="48" x2="52" y2="84" stroke="url(#specularEdge)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="18" y1="66" x2="52" y2="84" stroke="#38bdf8" stroke-width="1.6" opacity="0.95" />
      <line x1="86" y1="66" x2="52" y2="84" stroke="#00f0ff" stroke-width="1.6" opacity="0.9" />
      <line x1="18" y1="30" x2="18" y2="66" stroke="#ffffff" stroke-width="1.6" opacity="0.95" />
      <line x1="86" y1="30" x2="86" y2="66" stroke="#38bdf8" stroke-width="1.4" opacity="0.85" />

      <!-- HIGH-VISIBILITY ROUTEROS FRONT BEZEL TELEMETRY LEDS (Large & Vivid) -->
      <!-- LED 1: PWR (Emerald Green with large pulsing aura) -->
      <circle cx="58" cy="76" r="6" fill="#10b981" class="anim-pwr-halo" />
      <circle cx="58" cy="76" r="3.2" fill="#10b981" />
      <circle cx="58" cy="76" r="1.3" fill="#ffffff" />
      
      <!-- LED 2: WAN / TPROXY (Neon Cyan Breathing Beam) -->
      <circle cx="66" cy="72" r="6" fill="#00f0ff" class="anim-wan-halo" />
      <circle cx="66" cy="72" r="3.2" fill="#00f0ff" />
      <circle cx="66" cy="72" r="1.3" fill="#ffffff" />
      
      <!-- LED 3: DATA RX/TX (High-Frequency Packet Burst Flicker) -->
      <g class="anim-data-burst">
        <circle cx="74" cy="68" r="5.5" fill="#34d399" opacity="0.8" />
        <circle cx="74" cy="68" r="3.2" fill="#34d399" />
        <circle cx="74" cy="68" r="1.3" fill="#ffffff" />
      </g>

      <!-- Apex Diamond Sparkle -->
      <path d="M 52,9 Q 52,12 55,12 Q 52,12 52,15 Q 52,12 49,12 Q 52,12 52,9 Z" fill="#ffffff" opacity="1" filter="drop-shadow(0 0 4px #ffffff)" />
    </g>
  </g>
</svg>