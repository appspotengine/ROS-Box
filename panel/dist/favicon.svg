<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="g3a-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0072b2" />
      <stop offset="100%" stop-color="#002d50" />
    </linearGradient>
    <linearGradient id="g3a-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#004e82" />
    </linearGradient>
    <radialGradient id="g3a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.95)" />
      <stop offset="50%" stop-color="rgba(0, 78, 130, 0.45)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
    <filter id="f3a-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes dash-flow { to { stroke-dashoffset: -50; } }
    @keyframes core-pulse-3a {
      0%,100%{ transform: scale(0.96); filter: drop-shadow(0 0 8px rgba(0,240,255,0.8)); }
      50%{ transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(0,240,255,1)) drop-shadow(0 0 32px rgba(56,189,248,0.7)); }
    }
    .p3a-spin-r { transform-origin: 80px 80px; animation: spin-cw 8.5s linear infinite; }
    .p3a-spin-b { transform-origin: 80px 80px; animation: spin-ccw 6.5s linear infinite; }
    .p3a-core { transform-origin: 80px 80px; animation: core-pulse-3a 2.2s ease-in-out infinite; }
    .p3a-dash { animation: dash-flow 1.5s linear infinite; }
  ]]></style>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="52" fill="url(#g3a-glow)" />

  <!-- Outer Large Ambient Horizon -->
  <circle cx="80" cy="80" r="74" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2" stroke-dasharray="3 14" fill="none" opacity="0.7" />

  <!-- Large R-Orbit (Scale rx=71, ry=35, expanded to 95% frame) -->
  <g class="p3a-spin-r">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="8.5s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="71" ry="35" transform="rotate(-32 80 80)" stroke="rgba(0, 114, 178, 0.45)" stroke-width="7.5" fill="none" />
    <ellipse cx="80" cy="80" rx="71" ry="35" transform="rotate(-32 80 80)" stroke="url(#g3a-r)" stroke-width="4.5" fill="none" filter="url(#f3a-bloom)" />
    <g transform="rotate(-32 80 80)">
      <circle cx="151" cy="80" r="5.8" fill="#ffffff" filter="url(#f3a-bloom)" />
      <circle cx="151" cy="80" r="9.2" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.85" />
      <circle cx="9" cy="80" r="3.8" fill="#0072b2" />
    </g>
  </g>

  <!-- Large B-Orbit (Scale rx=71, ry=35, opposite tilt +32) -->
  <g class="p3a-spin-b">
    <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="6.5s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="71" ry="35" transform="rotate(32 80 80)" stroke="url(#g3a-b)" stroke-width="3.8" stroke-dasharray="14 7" fill="none" class="p3a-dash" />
    <g transform="rotate(32 80 80)">
      <circle cx="9" cy="80" r="5.2" fill="#00f0ff" filter="url(#f3a-bloom)" />
      <circle cx="151" cy="80" r="3.8" fill="#10b981" />
    </g>
  </g>

  <!-- Central Official RouterOS Core (Enlarged to 125%) -->
  <g class="p3a-core">
    <!-- Backplate Shield Hexagon -->
    <polygon points="80,51 106,65 106,95 80,109 54,95 54,65" fill="#002d50" stroke="#00f0ff" stroke-width="2.8" filter="url(#f3a-bloom)" />
    <!-- Inner Accent Hexagon -->
    <polygon points="80,54 102,67 102,93 80,106 58,93 58,67" fill="rgba(0, 45, 80, 0.9)" stroke="#38bdf8" stroke-width="1.4" />
    <!-- RouterOS Hex-M scaled to 2.18 -->
    <g transform="translate(53.8, 53.8) scale(2.18)">
      <path fill="url(#g3a-r)" d="M23.041 6.188a1.404 1.404 0 0 0-.218-.36c-.24-.296-.634-.586-1.14-.864l-4.052-2.22L13.576.519C13.074.243 12.61.065 12.22.013A1.772 1.772 0 0 0 12 0c-.432 0-.974.192-1.576.52L6.37 2.74 2.317 4.96c-.504.279-.9.569-1.14.867a1.59 1.59 0 0 0-.122.17 1.654 1.654 0 0 0-.096.19c-.15.348-.22.816-.22 1.368v8.887c0 .66.1 1.2.316 1.558.216.356.66.706 1.262 1.036l4.054 2.22 4.053 2.223c.504.276.966.456 1.36.506.145.02.291.02.436 0 .39-.05.852-.228 1.356-.506l8.107-4.443c.6-.33 1.046-.68 1.262-1.036.036-.06.068-.123.096-.188.15-.348.22-.818.22-1.37V7.556c0-.552-.07-1.02-.22-1.368zM7.233 16.618c0 .2-.218.33-.396.233l-1.45-.796a1.066 1.066 0 0 1-.552-.934v-4.296c0-.2.216-.33.394-.235l1.728.947a.53.53 0 0 1 .276.468v4.612zm11.934-1.497c0 .39-.213.748-.554.936l-1.45.794a.266.266 0 0 1-.394-.234v-5.692c0-.2-.217-.33-.395-.232l-2.62 1.434c-.34.187-.552.545-.552.934v5.646a.532.532 0 0 1-.278.468l-.41.224c-.32.176-.707.176-1.026 0l-.408-.224a.532.532 0 0 1-.278-.468v-5.646c0-.389-.212-.747-.552-.934L4.835 9.16v-.28c0-.388.212-.746.552-.934l.6-.328a1.064 1.064 0 0 1 1.022 0l4.48 2.452c.318.176.704.176 1.021 0l2.07-1.134a.266.266 0 0 0 0-.468L9.932 5.922a.266.266 0 0 1 0-.468l1.556-.852c.32-.176.707-.176 1.026 0l6.1 3.34c.342.188.554.547.553.936v6.243z"/>
    </g>
  </g>
</svg>
