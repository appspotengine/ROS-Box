<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 100" width="115" height="100">
  <defs>
    <style><![CDATA[
      /* ================= 60FPS MIKROTIK CYBER ORBITAL ANIMATIONS ================= */
      
      /* 3D Surrounding Orbital Ring 1 - Smooth Continuous 360 Spin */
      @keyframes orbitSurround1 {
        0% {
          transform: rotate(-26deg) rotateX(62deg) rotateZ(0deg);
        }
        100% {
          transform: rotate(-26deg) rotateX(62deg) rotateZ(360deg);
        }
      }

      /* 3D Surrounding Orbital Ring 2 - Reverse Counter-Rotation */
      @keyframes orbitSurround2 {
        0% {
          transform: rotate(32deg) rotateX(65deg) rotateZ(360deg);
        }
        100% {
          transform: rotate(32deg) rotateX(65deg) rotateZ(0deg);
        }
      }

      /* Central sing-box Quantum Core - Ultra-Bright Luminescent Reactor */
      @keyframes quantumCoreBreathe {
        0%, 100% {
          r: 16px;
          opacity: 0.95;
          filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 20px #38bdf8);
        }
        50% {
          r: 22px;
          opacity: 1;
          filter: drop-shadow(0 0 26px #00f0ff) drop-shadow(0 0 42px #00d2ff);
        }
      }

      /* Glass Top Facet Specular Light Sweep */
      @keyframes crystalSheen {
        0% {
          opacity: 0.3;
          transform: translateX(-15px) translateY(-8px);
        }
        50% {
          opacity: 0.9;
          transform: translateX(18px) translateY(9px);
        }
        100% {
          opacity: 0.3;
          transform: translateX(-15px) translateY(-8px);
        }
      }

      /* High-Visibility LEDs */
      @keyframes pwrHaloPulse {
        0%, 100% {
          r: 5px;
          opacity: 0.6;
          filter: drop-shadow(0 0 5px #10b981);
        }
        50% {
          r: 7.5px;
          opacity: 1;
          filter: drop-shadow(0 0 12px #10b981);
        }
      }

      @keyframes wanCyanHalo {
        0%, 100% {
          r: 5px;
          opacity: 0.7;
          filter: drop-shadow(0 0 6px #00f0ff);
        }
        50% {
          r: 8px;
          opacity: 1;
          filter: drop-shadow(0 0 14px #00f0ff);
        }
      }

      @keyframes dataPacketBurst {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        15% { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 10px #34d399); }
        35% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 9px #38bdf8); }
        70% { opacity: 0.25; transform: scale(0.9); }
        85% { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 10px #34d399); }
      }

      /* Chevrons */
      @keyframes chevTravel1 {
        0% { opacity: 0.3; transform: translateX(-6px); }
        50% { opacity: 1; transform: translateX(0px); filter: drop-shadow(0 0 6px #ffffff); }
        100% { opacity: 0.4; transform: translateX(6px); }
      }
      @keyframes chevTravel2 {
        0% { opacity: 0.4; transform: translateX(-4px); }
        50% { opacity: 1; transform: translateX(2px); filter: drop-shadow(0 0 7px #00f0ff); }
        100% { opacity: 0.5; transform: translateX(8px); }
      }

      /* Classes */
      .orbit-wrap-1 {
        transform-origin: 52px 50px;
        animation: orbitSurround1 9s linear infinite;
      }
      .orbit-wrap-2 {
        transform-origin: 52px 50px;
        animation: orbitSurround2 6.5s linear infinite;
      }
      .anim-core {
        animation: quantumCoreBreathe 2.8s ease-in-out infinite;
      }
      .anim-sheen {
        animation: crystalSheen 3.6s ease-in-out infinite;
      }
      .anim-pwr-halo {
        animation: pwrHaloPulse 2.2s ease-in-out infinite;
      }
      .anim-wan-halo {
        animation: wanCyanHalo 1.6s ease-in-out infinite;
      }
      .anim-data-burst {
        transform-origin: 74px 68px;
        animation: dataPacketBurst 1.2s steps(4, jump-none) infinite;
      }
      .anim-chev-1 {
        animation: chevTravel1 2s ease-in-out infinite;
      }
      .anim-chev-2 {
        animation: chevTravel2 2s ease-in-out infinite 0.3s;
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit-wrap-1, .orbit-wrap-2, .anim-core, .anim-sheen,
        .anim-pwr-halo, .anim-wan-halo, .anim-data-burst,
        .anim-chev-1, .anim-chev-2 {
          animation: none !important;
        }
      }
    ]]></style>

    <!-- ULTRA-BRIGHT LUMINESCENT CYBER & CLEAR ICE CRYSTAL GRADIENTS -->
    <radialGradient id="cyberBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#002d50" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Ice Crystal Top Lid (Very High Transmittance) -->
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45" />
    </linearGradient>

    <!-- Ultra-Clear Translucent Sapphire Left Facet (Internal Core Clearly Visible) -->
    <linearGradient id="sapphireLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#004e82" stop-opacity="0.5" />
    </linearGradient>

    <!-- Ultra-Clear Translucent Electric Cyan Right Facet -->
    <linearGradient id="cyanRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#004e82" stop-opacity="0.52" />
    </linearGradient>

    <!-- HyperCore Super-Radiant Plasma Glow (Pure Electric Cyan) -->
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#cffafe" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00d2ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Surrounding 3D Orbit Gradient 1 (Neon Cyan to Emerald) -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>

    <!-- Surrounding 3D Orbit Gradient 2 (White Diamond Stream) -->
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Brilliant Neon Wireframe Edges -->
    <linearGradient id="specularEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#cffafe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>

    <filter id="hologramDrop" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00f0ff" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(6, 0)">
    <!-- Cyan Ambient Backlight Aura -->
    <ellipse cx="52" cy="50" rx="48" ry="40" fill="url(#cyberBacklight)" />

    <!-- REAR SURROUNDING ORBIT ARC -->
    <g class="orbit-wrap-1">
      <ellipse cx="52" cy="50" rx="49" ry="19" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.2" stroke-dasharray="14, 8" opacity="0.9" />
      <circle cx="101" cy="50" r="3.2" fill="#00f0ff" filter="drop-shadow(0 0 7px #00f0ff)" />
      <circle cx="101" cy="50" r="1.4" fill="#ffffff" />
      <circle cx="3" cy="50" r="2.8" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)" />
    </g>

    <g class="orbit-wrap-2">
      <ellipse cx="52" cy="50" rx="43" ry="16" fill="none" stroke="url(#orbitGrad2)" stroke-width="1.8" stroke-dasharray="24, 6" opacity="0.95" />
      <circle cx="95" cy="50" r="2.8" fill="#ffffff" filter="drop-shadow(0 0 6px #ffffff)" />
    </g>

    <!-- THE 3D LUMINESCENT CRYSTAL CUBE -->
    <g filter="url(#hologramDrop)">
      <!-- Back Wall Interiors (Light Cyan Ambient Depth) -->
      <path d="M 52,48 L 52,14 L 18,32 L 18,66 Z" fill="#004e82" opacity="0.45" />
      <path d="M 52,48 L 52,14 L 86,32 L 86,66 Z" fill="#003865" opacity="0.5" />
      
      <!-- Interior Floor Plate with High-Speed Laser Bus -->
      <path d="M 52,48 L 18,66 L 52,84 L 86,66 Z" fill="#002d50" opacity="0.5" />
      <path d="M 32,58 L 52,70 L 72,58" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.95" fill="none" filter="drop-shadow(0 0 3px #00f0ff)" />

      <!-- Inside Central HyperCore (Clear, Vividly Radiant View) -->
      <circle cx="52" cy="48" r="18" fill="url(#plasmaGlow)" class="anim-core" />

      <!-- Internal High-Contrast Vector Routing Chevrons -->
      <g>
        <polyline points="40,43 49,48 40,53" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="anim-chev-1" />
        <polyline points="52,43 61,48 52,53" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="anim-chev-2" />
      </g>

      <!-- Front Left Facet (Ultra-Clear Crystal Frosted Glass) -->
      <path d="M 52,48 L 18,30 L 18,66 L 52,84 Z" fill="url(#sapphireLeft)" />
      <!-- Left Glass Bevel Reflection -->
      <path d="M 52,48 L 18,30 L 30,36 L 52,48 Z" fill="#ffffff" opacity="0.4" />

      <!-- Front Right Facet (Ultra-Clear Electric Cyan Glass) -->
      <path d="M 52,48 L 86,30 L 86,66 L 52,84 Z" fill="url(#cyanRight)" />
      <!-- Right Glass Bevel Reflection -->
      <path d="M 52,48 L 86,30 L 74,36 L 52,48 Z" fill="#ffffff" opacity="0.32" />

      <!-- Precision Router Vent Streams on Right Facet -->
      <line x1="60" y1="52" x2="78" y2="43" stroke="#00f0ff" stroke-width="1.6" opacity="0.85" filter="drop-shadow(0 0 2px #00f0ff)" />
      <line x1="60" y1="58" x2="78" y2="49" stroke="#00f0ff" stroke-width="1.6" opacity="0.85" filter="drop-shadow(0 0 2px #00f0ff)" />
      <line x1="60" y1="64" x2="78" y2="55" stroke="#00f0ff" stroke-width="1.6" opacity="0.85" filter="drop-shadow(0 0 2px #00f0ff)" />

      <!-- Top Frosted Ice Crystal Lid -->
      <path d="M 52,12 L 86,30 L 52,48 L 18,30 Z" fill="url(#crystalTop)" />
      <!-- Top Dynamic Light Sheen Sweep -->
      <path d="M 52,14 L 83,30 L 67,40 L 36,24 Z" fill="#ffffff" class="anim-sheen" opacity="0.65" />

      <!-- Brilliant Neon Metallic Specular Edges -->
      <path d="M 52,12 L 86,30 L 52,48 L 18,30 Z" fill="none" stroke="url(#specularEdge)" stroke-width="1.8" stroke-linejoin="round" />
      <line x1="52" y1="48" x2="52" y2="84" stroke="url(#specularEdge)" stroke-width="2" stroke-linecap="round" />
      <line x1="18" y1="66" x2="52" y2="84" stroke="#38bdf8" stroke-width="1.8" opacity="1" />
      <line x1="86" y1="66" x2="52" y2="84" stroke="#00f0ff" stroke-width="1.8" opacity="1" />
      <line x1="18" y1="30" x2="18" y2="66" stroke="#ffffff" stroke-width="1.8" opacity="1" />
      <line x1="86" y1="30" x2="86" y2="66" stroke="#38bdf8" stroke-width="1.6" opacity="0.95" />

      <!-- HIGH-VISIBILITY ROUTEROS FRONT BEZEL TELEMETRY LEDS -->
      <!-- LED 1: PWR (Emerald Green) -->
      <circle cx="58" cy="76" r="6" fill="#10b981" class="anim-pwr-halo" />
      <circle cx="58" cy="76" r="3.2" fill="#10b981" />
      <circle cx="58" cy="76" r="1.3" fill="#ffffff" />
      
      <!-- LED 2: WAN / TPROXY (Neon Cyan Breathing Beam) -->
      <circle cx="66" cy="72" r="6" fill="#00f0ff" class="anim-wan-halo" />
      <circle cx="66" cy="72" r="3.2" fill="#00f0ff" />
      <circle cx="66" cy="72" r="1.3" fill="#ffffff" />
      
      <!-- LED 3: DATA RX/TX (High-Frequency Packet Burst Flicker) -->
      <g class="anim-data-burst">
        <circle cx="74" cy="68" r="5.5" fill="#34d399" opacity="0.9" />
        <circle cx="74" cy="68" r="3.2" fill="#34d399" />
        <circle cx="74" cy="68" r="1.3" fill="#ffffff" />
      </g>

      <!-- Apex Diamond Sparkle -->
      <path d="M 52,8 Q 52,12 56,12 Q 52,12 52,16 Q 52,12 48,12 Q 52,12 52,8 Z" fill="#ffffff" opacity="1" filter="drop-shadow(0 0 5px #00f0ff)" />
    </g>
  </g>
</svg>