<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="morph-host-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#0072b2" />
      <stop offset="75%" stop-color="#002d50" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="morph-bypass-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#004e82" />
    </linearGradient>

    <radialGradient id="morph-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.95)" />
      <stop offset="45%" stop-color="rgba(0, 114, 178, 0.45)" />
      <stop offset="85%" stop-color="rgba(0, 45, 80, 0.1)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <filter id="morph-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.2" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes orbit-spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit-spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes stream-dash-flow {
      to { stroke-dashoffset: -45; }
    }
    @keyframes glow-breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50% { transform: scale(1.15); opacity: 0.95; }
    }
    @keyframes core-hyper-pulse {
      0%, 100% { transform: scale(0.94); filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.75)); }
      50% { transform: scale(1.10); filter: drop-shadow(0 0 16px rgba(0, 240, 255, 1)); }
    }
    @keyframes rb-cycle {
      0%, 20% { opacity: 0; transform: scale(0.92); }
      35%, 65% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
      80%, 100% { opacity: 0; transform: scale(1.06); }
    }
    @keyframes ring-dim-cycle {
      0%, 20% { opacity: 1; }
      35%, 65% { opacity: 0.65; }
      80%, 100% { opacity: 1; }
    }

    .anim-glow { transform-origin: 80px 80px; animation: glow-breathe 2.8s ease-in-out infinite; }
    .anim-host { transform-origin: 80px 80px; animation: orbit-spin-cw 9s linear infinite, ring-dim-cycle 6s ease-in-out infinite; }
    .anim-bypass { transform-origin: 80px 80px; animation: orbit-spin-ccw 6s linear infinite, ring-dim-cycle 6s ease-in-out infinite; }
    .anim-telemetry { transform-origin: 80px 80px; animation: orbit-spin-cw 25s linear infinite; }
    .anim-core { transform-origin: 80px 80px; animation: core-hyper-pulse 2.2s ease-in-out infinite; }
    .anim-rb-layer { transform-origin: 80px 80px; animation: rb-cycle 6s ease-in-out infinite; }
  </style>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="44" fill="url(#morph-core-glow)" class="anim-glow" />

  <!-- Telemetry Ring -->
  <g class="anim-telemetry" opacity="0.6">
    <circle cx="80" cy="80" r="70" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" stroke-dasharray="3 14" fill="none" />
    <circle cx="80" cy="10" r="2" fill="#00f0ff" />
    <circle cx="80" cy="150" r="2" fill="#00f0ff" />
    <circle cx="10" cy="80" r="2" fill="#38bdf8" />
    <circle cx="150" cy="80" r="2" fill="#38bdf8" />
  </g>

  <!-- Host Orbit (9s) -->
  <g class="anim-host">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="9s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(-30 80 80)" stroke="rgba(0, 114, 178, 0.45)" stroke-width="7" fill="none" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(-30 80 80)" stroke="url(#morph-host-grad)" stroke-width="4.2" fill="none" />
    <g transform="rotate(-30 80 80)">
      <circle cx="143" cy="80" r="5.5" fill="#ffffff" filter="url(#morph-bloom)" />
      <circle cx="143" cy="80" r="8.5" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.85" />
      <circle cx="17" cy="80" r="3.5" fill="#0072b2" />
    </g>
  </g>

  <!-- Bypass Orbit (6s) -->
  <g class="anim-bypass">
    <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="6s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(30 80 80)" stroke="url(#morph-bypass-grad)" stroke-width="3.5" stroke-dasharray="12 6" fill="none" style="animation: stream-dash-flow 1.5s linear infinite;" />
    <g transform="rotate(30 80 80)">
      <circle cx="17" cy="80" r="5" fill="#00f0ff" filter="url(#morph-bloom)" />
      <circle cx="143" cy="80" r="3.5" fill="#10b981" />
    </g>
  </g>

  <!-- Central Core Armor -->
  <g class="anim-core">
    <polygon points="80,59 98,69.5 98,90.5 80,101 62,90.5 62,69.5" fill="#002d50" stroke="#00f0ff" stroke-width="2.8" filter="url(#morph-bloom)" />
    <polygon points="80,64 93.5,72 93.5,88 80,96 66.5,88 66.5,72" fill="rgba(0, 78, 130, 0.85)" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M72 73 L78 80 L72 87" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M81 73 L87 80 L81 87" stroke="#00f0ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#morph-bloom)" />
    <circle cx="80" cy="80" r="3" fill="#ffffff" />
  </g>

  <!-- 6s Manifesting Cyber Monogram R & B (Dual-engine: CSS + SMIL) -->
  <g class="anim-rb-layer">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.35;0.65;0.8;1" dur="6s" repeatCount="indefinite" />

    <!-- Letter R (RouterOS) -->
    <g>
      <path d="M40 56 L40 104" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" filter="url(#morph-bloom)" />
      <path d="M40 58 C40 58 63 53 66 68 C69 79 48 80 40 80" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M52 80 L66 104" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <circle cx="40" cy="56" r="3" fill="#ffffff" />
      <circle cx="66" cy="104" r="2.8" fill="#00f0ff" />
    </g>

    <!-- Letter B (Box) -->
    <g>
      <path d="M94 56 L94 104" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#morph-bloom)" />
      <path d="M94 58 C94 58 114 55 115 70 C116 79 102 80 94 80" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M94 80 C104 80 119 80 119 92 C119 104 102 104 94 104" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <circle cx="94" cy="56" r="3" fill="#ffffff" />
      <circle cx="94" cy="104" r="3" fill="#38bdf8" />
      <circle cx="119" cy="92" r="2.8" fill="#c084fc" />
    </g>

    <line x1="66" y1="80" x2="94" y2="80" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.9" />
  </g>
</svg>
