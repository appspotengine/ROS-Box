<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="orb-host-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#0072b2" />
      <stop offset="75%" stop-color="#002d50" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="orb-bypass-d" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#004e82" />
    </linearGradient>

    <linearGradient id="ros-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#004e82" />
    </linearGradient>

    <radialGradient id="orb-glow-d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.95)" />
      <stop offset="45%" stop-color="rgba(0, 114, 178, 0.4)" />
      <stop offset="85%" stop-color="rgba(0, 45, 80, 0.1)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <filter id="bloom-d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.8" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes dash-flow { to { stroke-dashoffset: -45; } }
    @keyframes core-pulse {
      0%, 100% {
        transform: scale(0.95);
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 16px rgba(0, 240, 255, 1)) drop-shadow(0 0 28px rgba(56, 189, 248, 0.6));
      }
    }
    .anim-host { transform-origin: 80px 80px; animation: spin-cw 9s linear infinite; }
    .anim-bypass { transform-origin: 80px 80px; animation: spin-ccw 6s linear infinite; }
    .anim-telemetry { transform-origin: 80px 80px; animation: spin-cw 25s linear infinite; }
    .anim-core { transform-origin: 80px 80px; animation: core-pulse 2.2s ease-in-out infinite; }
  ]]></style>

  <!-- Ambient Core Glow -->
  <circle cx="80" cy="80" r="44" fill="url(#orb-glow-d)" />

  <!-- Outer Telemetry Ring -->
  <g class="anim-telemetry" opacity="0.65">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="25s" repeatCount="indefinite" />
    <circle cx="80" cy="80" r="70" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" stroke-dasharray="3 14" fill="none" />
    <circle cx="80" cy="10" r="2" fill="#00f0ff" />
    <circle cx="80" cy="150" r="2" fill="#00f0ff" />
    <circle cx="10" cy="80" r="2" fill="#38bdf8" />
    <circle cx="150" cy="80" r="2" fill="#38bdf8" />
  </g>

  <!-- Host Orbit (9s clockwise) -->
  <g class="anim-host">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="9s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(-30 80 80)" stroke="rgba(0, 114, 178, 0.45)" stroke-width="7" fill="none" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(-30 80 80)" stroke="url(#orb-host-d)" stroke-width="4.2" fill="none" />
    <g transform="rotate(-30 80 80)">
      <circle cx="143" cy="80" r="5.5" fill="#ffffff" filter="url(#bloom-d)" />
      <circle cx="143" cy="80" r="8.5" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.85" />
      <circle cx="17" cy="80" r="3.5" fill="#0072b2" />
    </g>
  </g>

  <!-- Bypass Orbit (6s counterclockwise) -->
  <g class="anim-bypass">
    <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="6s" repeatCount="indefinite" />
    <ellipse cx="80" cy="80" rx="63" ry="29" transform="rotate(30 80 80)" stroke="url(#orb-bypass-d)" stroke-width="3.5" stroke-dasharray="12 6" fill="none" style="animation: dash-flow 1.5s linear infinite;" />
    <g transform="rotate(30 80 80)">
      <circle cx="17" cy="80" r="5" fill="#00f0ff" filter="url(#bloom-d)" />
      <circle cx="143" cy="80" r="3.5" fill="#10b981" />
    </g>
  </g>

  <!-- Central Core: Official MikroTik RouterOS Hex-M Logo -->
  <g class="anim-core">
    <!-- Backplate Shield Hexagon -->
    <polygon points="80,56 101,68 101,92 80,104 59,92 59,68" fill="#002d50" stroke="#00f0ff" stroke-width="2.5" filter="url(#bloom-d)" />
    <!-- Inner Accent Hexagon -->
    <polygon points="80,59 98,69.5 98,90.5 80,101 62,90.5 62,69.5" fill="rgba(0, 45, 80, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Official MikroTik Mark Path centered at (80,80) -->
    <g transform="translate(59, 59) scale(1.75)">
      <path fill="url(#ros-logo-grad)" d="M23.041 6.188a1.404 1.404 0 0 0-.218-.36c-.24-.296-.634-.586-1.14-.864l-4.052-2.22L13.576.519C13.074.243 12.61.065 12.22.013A1.772 1.772 0 0 0 12 0c-.432 0-.974.192-1.576.52L6.37 2.74 2.317 4.96c-.504.279-.9.569-1.14.867a1.59 1.59 0 0 0-.122.17 1.654 1.654 0 0 0-.096.19c-.15.348-.22.816-.22 1.368v8.887c0 .66.1 1.2.316 1.558.216.356.66.706 1.262 1.036l4.054 2.22 4.053 2.223c.504.276.966.456 1.36.506.145.02.291.02.436 0 .39-.05.852-.228 1.356-.506l8.107-4.443c.6-.33 1.046-.68 1.262-1.036.036-.06.068-.123.096-.188.15-.348.22-.818.22-1.37V7.556c0-.552-.07-1.02-.22-1.368zM7.233 16.618c0 .2-.218.33-.396.233l-1.45-.796a1.066 1.066 0 0 1-.552-.934v-4.296c0-.2.216-.33.394-.235l1.728.947a.53.53 0 0 1 .276.468v4.612zm11.934-1.497c0 .39-.213.748-.554.936l-1.45.794a.266.266 0 0 1-.394-.234v-5.692c0-.2-.217-.33-.395-.232l-2.62 1.434c-.34.187-.552.545-.552.934v5.646a.532.532 0 0 1-.278.468l-.41.224c-.32.176-.707.176-1.026 0l-.408-.224a.532.532 0 0 1-.278-.468v-5.646c0-.389-.212-.747-.552-.934L4.835 9.16v-.28c0-.388.212-.746.552-.934l.6-.328a1.064 1.064 0 0 1 1.022 0l4.48 2.452c.318.176.704.176 1.021 0l2.07-1.134a.266.266 0 0 0 0-.468L9.932 5.922a.266.266 0 0 1 0-.468l1.556-.852c.32-.176.707-.176 1.026 0l6.1 3.34c.342.188.554.547.553.936v6.243z"/>
    </g>
  </g>
</svg>
