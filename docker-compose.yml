services:
  ros-box:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros-box:latest
    container_name: ros-box
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "2026:2026"
      - "7853:7853/udp"
      - "7853:7853/tcp"
      - "7890:7890"
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./data:/opt/open-box/data
      - ./etc:/opt/open-box/etc
    environment:
      - PORT=2026
      - OPENBOX_PLATFORM=container
