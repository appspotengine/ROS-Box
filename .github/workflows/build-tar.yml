name: Build ROS-Box Container Tarballs

on:
  schedule:
    # 每天北京时间 11:00 (UTC 03:00) 和 23:00 (UTC 15:00)
    - cron: '0 3,15 * * *'
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export linux/amd64 Tarball
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ros-box:amd64 \
            --output type=docker,compression=uncompressed,dest=ROS-Box-amd64.tar \
            .

      - name: Build and Export linux/arm64 Tarball
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ros-box:arm64 \
            --output type=docker,compression=uncompressed,dest=ROS-Box-arm64.tar \
            .

      - name: Upload Tarballs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros-box-tarballs
          path: |
            ROS-Box-*.tar
